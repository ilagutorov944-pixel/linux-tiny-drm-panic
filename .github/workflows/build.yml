name: Build Linux 6.12 Kernel & Live XFCE Desktop Distro

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc \
                                  grub-pc-bin grub-efi-amd64-bin xorriso mtools curl wget tar xz-utils cpio gzip zstd

      - name: Download Linux 6.12 source
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.10.tar.xz
          mkdir -p build_src
          tar -xf linux-6.12.10.tar.xz -C build_src --strip-components=1
          sed -i 's/-fshort-wchar/-fshort-wchar -std=gnu11/' build_src/drivers/firmware/efi/libstub/Makefile
          sed -i 's/-fshort-wchar/-fshort-wchar -std=gnu11/' build_src/arch/x86/boot/compressed/Makefile

      - name: Configure Linux Kernel
        run: |
          cd build_src
          if [ -f ../.config ]; then
            cp ../.config .config
          elif [ -f ../arch/x86/configs/tiny_xfce_defconfig ]; then
            cp ../arch/x86/configs/tiny_xfce_defconfig .config
          fi
          make olddefconfig

      - name: Compile bzImage
        run: |
          cd build_src
          make -j$(nproc) bzImage

      - name: Build XFCE & Falkon Live Rootfs
        run: |
          chmod +x build_rootfs.sh
          docker run --rm --privileged -v $(pwd):/workspace alpine:3.21 /workspace/build_rootfs.sh
          cd rootfs
          sudo find . | sudo cpio -H newc -o | gzip -9 > ../initramfs.img
          cd ..
          ls -lh initramfs.img

      - name: Generate Bootable Hybrid ISO
        run: |
          mkdir -p isodir/boot/grub
          cp build_src/arch/x86/boot/bzImage isodir/boot/vmlinuz
          cp initramfs.img isodir/boot/initramfs.img

          cat > isodir/boot/grub/grub.cfg << 'EOF'
          set default=0
          set timeout=3

          insmod all_video
          insmod gfxterm

          menuentry "Linux 6.12 (XFCE Desktop + Falkon Browser - DRM Panic Enabled)" {
              linux /boot/vmlinuz console=tty0 drm.panic_screen=user initcall_blacklist=bochs_pci_driver_init quiet
              initrd /boot/initramfs.img
              boot
          }

          menuentry "Linux 6.12 (Direct Boot - Test DRM Panic Tux Screen)" {
              linux /boot/vmlinuz console=tty0 drm.panic_screen=user initcall_blacklist=bochs_pci_driver_init panic=0
              boot
          }
          EOF

          grub-mkrescue -o linux.iso isodir
          ls -lh linux.iso

      - name: Upload Distro Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-6.12-xfce-falkon-distro
          path: |
            build_src/arch/x86/boot/bzImage
            initramfs.img
            linux.iso
