name: Build Linux 6.12 Kernel & Bootable ISO

on:
  push:
    branches: [ "main", "master" }
  worlflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      name: Checkout repository
      uses: actions/checkout@v4

      name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc \
        grub-pc-bin grub-efi-amd64-bin xorriso mtools curl wget tar xz-utils

      name: Download Linux 6.12 source
      run: |
        wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.10.tar.xz
        mkdir -p build_src
        tar -xf linux-6.12.10.tar.xz -C build_src --strip-components=1

      name: Configure Linux Kernel
      run: |
        cd build_src
        if [ -f ../.config ]; then
          cp ../.config .config
        elif [ -f ../arch/x86/configs/tiny_xfce_defconfig ]; then
          cp ../arch/x86/configs/tiny_xfce_defconfig .config
        fi
        make olddefconfig

      name: Compile bzImage
      run: |
        cd build_src
        make -j$(nproc) bzImage

      name: Generate Bootable Hybrid ISO
      run: |
        mkdir -p isodir/boot/grub
        cp build_src/arch/x86/boot/bzImage isodir/boot/vmlinuz

        cat > isodir/boot/grub/grub.cfg << 'EOF'
        set default=0
        set timeout=5

        insmod all_video
        insmod gfxterm

        menuentry "Linux 6.12 (Tiny-XFCE - DRM Panic Enabled)" {
            linux /boot/vmlinuz console=tty0 drm.panic_screen=user quiet
            boot
        }

        menuentry "Linux 6.12 (Direct Boot - Test DRM Panic QR/User Screen)" {
            linux /boot/vmlinuz console=tty0 drm.panic_screen=user
            boot
        ]

        menuentry "Linux 6.12 (Verbose Console Debug)" {
            linux /boot/vmlinuz console=tty0 drm.panic_screen=user earlyprintk=vga loglevel=7
            boot
        }
        EOF

        grub-mkrescue -o linux.iso isodir

      name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-6.12-artifacts
        path: |
          build_src/arch/x86/boot/bzImage
          linux.iso
        
